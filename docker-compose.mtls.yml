# Дополнение к docker-compose.yml: взаимная TLS-аутентификация (mTLS) между шлюзом и сервисами и
# между самими сервисами. К каждому сервису можно обратиться только с клиентским сертификатом
# внутреннего CA, а что именно вызывающему можно, решает его CN (infra/mtls/*.conf). Имя вызывающего
# прокси-сайдкар передаёт приложению в X-Caller-Identity; статических токенов нет.
#
#   nginx    ──► auth-svc      /auth/*, /users/me           (но не /internal/*)
#   nginx    ──► chat-svc      /ws/chat (WebSocket)
#   nginx    ──► library-svc   /library/*, /api/documents/*
#   nginx    ──► db-svc        админ-панель
#   chat-svc ──► auth-svc      /internal/users/{id}/profile
#   chat-svc ──► graph-rag-svc /generate, /cancel
#   db-svc   ──► graph-rag-svc /internal/graph/*
#   graph-rag-svc ──► chat-svc /ws/internal/llm (WebSocket)
#   graph-rag-svc, ingest-worker ──► embedding-svc  /embed, /ping
#   auth-svc, chat-svc ──► redis  (TCP, порт 6380, плюс ACL-пользователь на сервис)
#   library-svc, ingest-worker (чтение), db-svc (чтение и запись) ──► minio  (порт 8443, права по CN)
#   auth-svc ──► minio  (только бакет avatars: аватары пользователей)
#   graph-rag-svc ──► llm-proxy  POST /v1/chat/completions (порт 8443 самого llm-proxy, без сайдкара)
#   llm-proxy ──► ollama  /v1/chat/completions (режим ollama в config.json; профиль llm, модель
#                грузит ollama-init изнутри)
#
# Подключение: после docker-compose.pki.yml (нужен step-ca и профиль pki), например
#   COMPOSE_FILE=docker-compose.yml:docker-compose.pki.yml:docker-compose.mtls.yml
#
# Предварительно выпустить сертификаты (имя = идентичность = CN):
#   for s in nginx auth-svc chat-svc library-svc db-svc graph-rag-svc embedding-svc ingest-worker redis minio ollama llm-proxy; do
#       scripts/pki/enroll.sh "$s"; done
# Подробности: infra/pki/README.md, раздел «mTLS между сервисами».
#
# Как это устроено. Рядом с получателем работает прокси (nginx) в ТОМ ЖЕ сетевом пространстве
# (network_mode: service:...). Само приложение переводится на 127.0.0.1, поэтому до него нельзя
# достучаться напрямую из другого контейнера: открыт только порт 8443 прокси с проверкой
# сертификата. Вызывающие ходят на https://<сервис>:8443 и предъявляют свой сертификат; шлюз —
# так же (схема и порт апстримов приходят в nginx переменными UPSTREAM_SCHEME и UPSTREAM_PORT).
# Ещё два шага: python3 scripts/gen_redis_acl.py (пароли и ACL Redis) и
# python3 scripts/gen_minio_credentials.py (случайные ключи MinIO вместо minioadmin).
# Без этого файла стек работает как раньше.

x-mtls-renewer: &mtls-renewer
  image: smallstep/step-ca:0.30.2
  profiles: ["pki"]
  restart: unless-stopped
  user: "0"
  entrypoint: ["/bin/sh", "/renewer.sh"]
  healthcheck:
    disable: true
  networks:
    - pki-net

x-mtls-sidecar: &mtls-sidecar
  image: nginx:1.27-alpine
  restart: unless-stopped

# Как вызывающий сервис находит свой клиентский сертификат (app/mtls.py в каждом сервисе).
x-mtls-client-env: &mtls-client-env
  SERVICE_MTLS_CERT: /pki-svc/tls.crt
  SERVICE_MTLS_KEY: /pki-svc/tls.key
  SERVICE_MTLS_CA: /pki-svc/root_ca.crt

services:
  # --- шлюз: ходит в сервисы со своим сертификатом ---

  nginx:
    environment:
      UPSTREAM_SCHEME: https
      UPSTREAM_PORT: "8443"
    volumes:
      - mtls_nginx:/pki-svc:ro
      - ./infra/nginx/backend_tls.conf:/etc/nginx/backend_tls/tls.conf:ro

  nginx-certs:
    <<: *mtls-renewer
    # Общее пространство процессов с nginx: после обновления сертификата он получает SIGHUP
    # (PID 1 в его контейнере) и перечитывает файлы.
    pid: "service:nginx"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_nginx:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # --- получатели: приложение слушает только localhost, снаружи — прокси ---

  auth-svc:
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *mtls-client-env
      INTERNAL_AUTH_MODE: mtls
      REDIS_URL: rediss://auth-svc:${REDIS_AUTH_PASSWORD:?запустите scripts/gen_redis_acl.py}@redis:6380/0
      MINIO_ENDPOINT: minio:8443
      MINIO_SECURE: "true"
    volumes:
      - mtls_auth-svc:/pki-svc:ro

  auth-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:auth-svc"
    depends_on:
      auth-svc:
        condition: service_started
        # пересоздали получателя через compose — пересоздаётся и прокси в его пространстве
        restart: true
    volumes:
      - mtls_auth-svc:/pki-svc:ro
      - ./infra/mtls/auth-svc.conf:/etc/nginx/conf.d/default.conf:ro

  auth-svc-certs:
    <<: *mtls-renewer
    pid: "service:auth-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_auth-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # --- Redis: слушает только localhost, снаружи — TCP-прокси с проверкой сертификата ---

  redis:
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --aclfile
      - /etc/redis/users.acl
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "health", "--pass", "x", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./secrets/redis/users.acl:/etc/redis/users.acl:ro

  redis-mtls:
    <<: *mtls-sidecar
    network_mode: "service:redis"
    depends_on:
      redis:
        condition: service_started
        restart: true
    volumes:
      - mtls_redis:/pki-svc:ro
      - ./infra/mtls/redis.conf:/etc/nginx/nginx.conf:ro

  redis-certs:
    <<: *mtls-renewer
    pid: "service:redis-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_redis:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # --- MinIO: слушает только localhost, снаружи — прокси с правами по CN ---

  minio:
    command: ["server", "/data", "--address", "127.0.0.1:9000", "--console-address", "127.0.0.1:9001"]

  minio-mtls:
    <<: *mtls-sidecar
    network_mode: "service:minio"
    depends_on:
      minio:
        condition: service_started
        restart: true
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-avatars}
    volumes:
      - mtls_minio:/pki-svc:ro
      # шаблон: nginx подставляет ${MINIO_BUCKET} и ${MINIO_AVATARS_BUCKET} при старте контейнера
      - ./infra/mtls/minio.conf:/etc/nginx/templates/default.conf.template:ro

  minio-certs:
    <<: *mtls-renewer
    pid: "service:minio-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_minio:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # Создаёт бакет изнутри сетевого пространства MinIO, минуя прокси (сертификата у него нет).
  minio-init:
    network_mode: "service:minio"
    networks: !reset null
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@127.0.0.1:9000

  # --- Ollama (профиль llm): слушает только localhost, снаружи — прокси; модель тянет ollama-init ---

  ollama:
    environment:
      OLLAMA_HOST: 127.0.0.1:11434

  ollama-mtls:
    <<: *mtls-sidecar
    profiles: ["llm"]
    network_mode: "service:ollama"
    depends_on:
      ollama:
        condition: service_started
        restart: true
    volumes:
      - mtls_ollama:/pki-svc:ro
      - ./infra/mtls/ollama.conf:/etc/nginx/conf.d/default.conf:ro

  ollama-certs:
    <<: *mtls-renewer
    profiles: ["llm"]
    pid: "service:ollama-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_ollama:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  ollama-init:
    network_mode: "service:ollama"
    networks: !reset null
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434

  # --- llm-proxy: сам nginx, поэтому mTLS (порт 8443) и политика по CN — в нём же, без сайдкара ---

  llm-proxy:
    environment:
      # обычный HTTP остаётся только для проверки живости изнутри контейнера
      LLM_PROXY_LISTEN: 127.0.0.1:8080
    volumes:
      - mtls_llm-proxy:/pki-svc:ro
      # сервер на 8443: только CN graph-rag-svc и только POST /v1/chat/completions
      - ./infra/mtls/llm-proxy.conf:/etc/nginx/conf.d/mtls.conf:ro
      # клиентский сертификат прокси для режима ollama (ollama.conf пускает CN llm-proxy)
      - ./infra/llm-proxy/ollama_client_tls.conf:/etc/nginx/llm-proxy-tls/ollama.conf:ro

  llm-proxy-certs:
    <<: *mtls-renewer
    pid: "service:llm-proxy"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_llm-proxy:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  library-svc:
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *mtls-client-env
      MINIO_ENDPOINT: minio:8443
      MINIO_SECURE: "true"
    volumes:
      - mtls_library-svc:/pki-svc:ro

  library-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:library-svc"
    depends_on:
      library-svc:
        condition: service_started
        restart: true
    volumes:
      - mtls_library-svc:/pki-svc:ro
      - ./infra/mtls/library-svc.conf:/etc/nginx/conf.d/default.conf:ro

  library-svc-certs:
    <<: *mtls-renewer
    pid: "service:library-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_library-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  graph-rag-svc:
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *mtls-client-env
      INTERNAL_AUTH_MODE: mtls
      EMBEDDING_SVC_URL: https://embedding-svc:8443
      CHAT_WS_URL: wss://chat-svc:8443/ws/internal/llm
      # llm-proxy сам принимает mTLS на 8443 (сайдкара нет); пускает только CN graph-rag-svc
      LLM_BASE_URL: https://llm-proxy:8443/v1
    volumes:
      - mtls_graph-rag-svc:/pki-svc:ro

  graph-rag-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:graph-rag-svc"
    depends_on:
      graph-rag-svc:
        condition: service_started
        restart: true
    volumes:
      - mtls_graph-rag-svc:/pki-svc:ro
      - ./infra/mtls/graph-rag-svc.conf:/etc/nginx/conf.d/default.conf:ro

  graph-rag-svc-certs:
    <<: *mtls-renewer
    pid: "service:graph-rag-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_graph-rag-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  embedding-svc:
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      INTERNAL_AUTH_MODE: mtls
    volumes:
      - mtls_embedding-svc:/pki-svc:ro

  embedding-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:embedding-svc"
    depends_on:
      embedding-svc:
        condition: service_started
        restart: true
    volumes:
      - mtls_embedding-svc:/pki-svc:ro
      - ./infra/mtls/embedding-svc.conf:/etc/nginx/conf.d/default.conf:ro

  embedding-svc-certs:
    <<: *mtls-renewer
    pid: "service:embedding-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_embedding-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # --- chat-svc и db-svc: и получатели (за шлюзом), и вызывающие (graph-rag-svc, auth-svc) ---

  chat-svc:
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *mtls-client-env
      INTERNAL_AUTH_MODE: mtls
      LLM_STREAM_URL: https://graph-rag-svc:8443/generate
      LLM_CANCEL_URL: https://graph-rag-svc:8443/cancel
      AUTH_PROFILE_URL: https://auth-svc:8443/internal/users/{user_id}/profile
      REDIS_URL: rediss://chat-svc:${REDIS_CHAT_PASSWORD:?запустите scripts/gen_redis_acl.py}@redis:6380/0
    volumes:
      - mtls_chat-svc:/pki-svc:ro

  chat-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:chat-svc"
    depends_on:
      chat-svc:
        condition: service_started
        restart: true
    volumes:
      - mtls_chat-svc:/pki-svc:ro
      - ./infra/mtls/chat-svc.conf:/etc/nginx/conf.d/default.conf:ro

  chat-svc-certs:
    <<: *mtls-renewer
    pid: "service:chat-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_chat-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  db-svc:
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *mtls-client-env
      GRAPH_RAG_URL: https://graph-rag-svc:8443
      MINIO_ENDPOINT: minio:8443
      MINIO_SECURE: "true"
    volumes:
      - mtls_db-svc:/pki-svc:ro

  db-svc-mtls:
    <<: *mtls-sidecar
    network_mode: "service:db-svc"
    depends_on:
      db-svc:
        condition: service_started
        restart: true
    volumes:
      - mtls_db-svc:/pki-svc:ro
      - ./infra/mtls/db-svc.conf:/etc/nginx/conf.d/default.conf:ro

  db-svc-certs:
    <<: *mtls-renewer
    pid: "service:db-svc-mtls"
    environment:
      CA_URL: https://step-ca:9000
      RENEW_EXEC: "kill -HUP 1"
    volumes:
      - mtls_db-svc:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

  # --- вызывающий без собственного сервера ---

  ingest-worker:
    environment:
      <<: *mtls-client-env
      EMBEDDING_SVC_URL: https://embedding-svc:8443
      S3_ENDPOINT: https://minio:8443
    volumes:
      - mtls_ingest-worker:/pki-svc:ro

  ingest-worker-certs:
    <<: *mtls-renewer
    environment:
      CA_URL: https://step-ca:9000
    volumes:
      - mtls_ingest-worker:/certs
      - ./infra/pki/renewer.sh:/renewer.sh:ro

# Тома создаёт scripts/pki/enroll.sh; имя тома = pki_certs_<идентичность>.
volumes:
  mtls_ollama:
    external: true
    name: pki_certs_ollama
  mtls_llm-proxy:
    external: true
    name: pki_certs_llm-proxy
  mtls_minio:
    external: true
    name: pki_certs_minio
  mtls_redis:
    external: true
    name: pki_certs_redis
  mtls_nginx:
    external: true
    name: pki_certs_nginx
  mtls_auth-svc:
    external: true
    name: pki_certs_auth-svc
  mtls_library-svc:
    external: true
    name: pki_certs_library-svc
  mtls_graph-rag-svc:
    external: true
    name: pki_certs_graph-rag-svc
  mtls_embedding-svc:
    external: true
    name: pki_certs_embedding-svc
  mtls_chat-svc:
    external: true
    name: pki_certs_chat-svc
  mtls_db-svc:
    external: true
    name: pki_certs_db-svc
  mtls_ingest-worker:
    external: true
    name: pki_certs_ingest-worker
