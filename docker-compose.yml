services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Профиль `llm` — потому что резервация GPU ниже делает контейнер незапускаемым на машине
    # без nvidia container toolkit, а `docker compose up` поднимает все сервисы разом: без
    # профиля такая машина не смогла бы поднять вообще ничего. Включается через
    # COMPOSE_PROFILES=llm в main/.env (там же объяснено, когда её убирать).
    profiles: ["llm"]
    # Только петлевой интерфейс, как у db-svc/graph-rag-svc/embedding-svc: у ollama нет
    # аутентификации, и наружу это открытый доступ к генерации на GPU машины. На связь между
    # контейнерами публикация портов не влияет вовсе — graph-rag-svc ходит на
    # http://ollama:11434 внутри сети app-network, минуя хост.
    # Порт наружу не публикуется: снаружи должен быть виден только nginx.
    # ports:
    #   - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Проверка готовности, а не факта запуска процесса: `ollama list` отвечает только когда
    # сервер уже слушает. На неё опирается ollama-init — раньше он вместо этого ждал
    # фиксированные 5 секунд и на холодном volume или медленной инициализации GPU
    # успевал сходить в ещё не поднятый сервер.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app-network

  # Разовая загрузка модели после старта сервера. Отдельным контейнером, а не хуком
  # post_start у самой ollama: у хука не гарантировано время выполнения и его падение не
  # роняет сервис, а завершение init-контейнера — событие в графе зависимостей, на которое
  # можно повесить condition: service_completed_successfully.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_healthy
    # Модель берётся из OLLAMA_MODEL — той же переменной, что уходит в graph-rag-svc.
    # Раньше здесь было зашито `ollama pull mistral`, и после смены переменной сервис просил
    # бы модель, которую никто не скачал. $$ — экранирование от подстановки самим compose:
    # переменная должна раскрыться внутри контейнера.
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$OLLAMA_MODEL\""]
    environment:
      # OLLAMA_HOST делает CLI чистым HTTP-клиентом: загрузка идёт по сети и ложится в volume
      # сервера, поэтому монтировать ollama_data сюда не нужно (раньше монтировалось впустую).
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    networks:
      - app-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CHAT_DB_USER: ${CHAT_DB_USER}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
      LIBRARY_DB_USER: ${LIBRARY_DB_USER}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD}
      # пользователей может быть больше надо перепроверить
    # Порт наружу не публикуется: наружу должен смотреть только nginx, всё остальное —
    # только внутри app-network. Для локального psql используйте `docker compose exec postgres psql ...`.
    # ports:
    #   - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20


  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    # ports:
    #   - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_REGION_NAME: ${MINIO_REGION}
    command: server /data --console-address ":9001"
    # Порты наружу не публикуются: снаружи должен быть виден только nginx. Консоль MinIO
    # при необходимости — через `docker compose exec` или временный `docker compose port`.
    # ports:
    #   - "${MINIO_PORT}:9000"
    #   - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb -p local/${MINIO_BUCKET} || true &&
      mc anonymous set none local/${MINIO_BUCKET} || true
      "
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: ./infra/nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  embedding-svc:
    build:
      context: ../services/embedding-svc
      dockerfile: Dockerfile
    container_name: embedding-svc
    restart: unless-stopped
    # Порт наружу не публикуется: снаружи должен быть виден только nginx.
    # ports:
    #   - "127.0.0.1:${EMBEDDING_PUBLIC_PORT}:8000"
    env_file:
      - ../services/embedding-svc/.env
    environment:
      EMBEDDER_MODEL_NAME: ${EMBEDDER_MODEL_NAME}
    volumes:
      - hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app-network

  auth-svc:
    build:
      context: ../services/auth-svc
      dockerfile: Dockerfile
    container_name: auth-svc
    restart: unless-stopped
    # ports:
    #   - "${AUTH_PUBLIC_PORT}:8000"
    env_file:
      - ../services/auth-svc/.env
    environment:
      # PORT здесь не задаём: порт зашит в CMD Dockerfile'а (8000), а переменная
      # AUTH_INTERNAL_PORT нигде не определена — compose ругался на пустое значение.
      DATABASE_URL: ${AUTH_DATABASE_URL}
      REDIS_URL: redis://${REDIS_HOST}:6379/0
    volumes:
      - ../services/auth-svc:/app
    networks:
      - app-network

  library-svc:
    build:
      context: ../services/library-svc
      dockerfile: Dockerfile
    container_name: library-svc
    restart: unless-stopped
    # Порт намеренно не публикуется: у сервиса нет собственной аутентификации, и снаружи
    # он должен быть доступен только через nginx, который проверяет JWT (auth_request).
    env_file:
      - ../services/library-svc/.env
    environment:
      POSTGRES_USER: ${LIBRARY_DB_USER}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: ${LIBRARY_DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_SECURE: ${MINIO_SECURE}
    volumes:
      - ../services/library-svc:/app
    networks:
      - app-network

  chat-svc:
    build:
      context: ../services/chat-svc
      dockerfile: Dockerfile
    container_name: chat-svc
    restart: unless-stopped
    # Порт намеренно не публикуется. chat-svc не проверяет JWT сам — он доверяет заголовку
    # X-User-Id, который проставляет nginx после auth_request. Прямой доступ к контейнеру
    # позволил бы подделать этот заголовок и войти в любую чужую сессию.
    env_file:
      - ../services/chat-svc/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_URL: ${CHAT_DATABASE_URL}
      REDIS_URL: redis://${REDIS_HOST}:6379/0
      REDIS_CHANNEL: ws:broadcast
    networks:
      - app-network

  graph-rag-svc:
    build:
      context: ../services/graph-rag-svc
      dockerfile: Dockerfile
      args:
        # Ставить torch/transformers/accelerate в образ (~5 ГБ) или нет. Нужны только
        # провайдеру LLM_PROVIDER=local, который в прод-среде использоваться не должен.
        WITH_LOCAL_LLM: "${GRAPH_RAG_WITH_LOCAL_LLM:-false}"
    container_name: graph-rag-svc
    restart: unless-stopped
    # Порт наружу не публикуется: снаружи должен быть виден только nginx.
    # ports:
    #   - "127.0.0.1:${GRAPH_RAG_PUBLIC_PORT}:8000"
    env_file:
      - ../services/graph-rag-svc/.env
    environment:
      DATABASE_URL: ${GRAPH_RAG_DATABASE_URL}
      EMBEDDING_SVC_URL: http://embedding-svc:8000
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - graph_rag_hf_cache:/app/.cache/huggingface
      - pip_cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      embedding-svc:
        condition: service_started
    networks:
      - app-network

  ingest-worker:
    build:
      context: ../services/ingest-worker
      dockerfile: Dockerfile
    container_name: ingest-worker
    restart: unless-stopped
    # Порт не публикуется: это background worker без HTTP-сервера.
    env_file:
      - ../services/ingest-worker/.env
    environment:
      DATABASE_URL: ${INGESTWOKRER_DATABASE_URL}
      EMBEDDING_SVC_URL: http://embedding-svc:8000
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      # Воркер читает S3_*, а не MINIO_*, как остальные сервисы. Значения берём из тех же
      # переменных, чтобы адрес хранилища оставался в одном месте. Без этого блока он
      # молча падал на умолчании http://localhost:9000 — внутри контейнера это он сам.
      # MINIO_ENDPOINT задаётся без схемы (host:port), поэтому http:// добавляем здесь.
      S3_ENDPOINT: http://${MINIO_ENDPOINT}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ../services/ingest-worker:/app
    depends_on:
      postgres:
        condition: service_healthy
      embedding-svc:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - app-network

  db-svc:
    build: 
      context: ../services/db-svc
      dockerfile: Dockerfile
    container_name: db-svc
    env_file:
      - ../services/db-svc/.env
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_SECURE: ${MINIO_SECURE}

      DBSVC_ADMIN_TOKEN: ${DBSVC_ADMIN_TOKEN}
      GRAPH_RAG_URL: http://graph-rag-svc:8000
    # Без ожидания готовности базы сервис успевал стартовать раньше postgres, получал
    # "Connection refused" и продолжал работу без таблицы журнала задач: импорт падал
    # пятисоткой уже в интерфейсе, а причина оставалась в первых строках лога.
    depends_on:
      postgres:
        condition: service_healthy
    # Порт наружу не публикуется: снаружи должен быть виден только nginx.
    # ports:
    #   - "127.0.0.1:${DBSVC_PUBLIC_PORT}:8000"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pg_data:
  redis_data:
  minio_data:
  hf_cache:
  graph_rag_hf_cache:
  ollama_data:
  pip_cache:

networks:
  app-network:
    driver: bridge
