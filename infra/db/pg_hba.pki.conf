# pg_hba.conf для Postgres с TLS и входом по сертификатам (docker-compose.pki.yml).
# Заменяет pg_hba.conf, созданный initdb; действует только при запуске с этим override.
#
# Правила проверяются сверху вниз, срабатывает первое подходящее.

# Сокет внутри контейнера: инициализация, healthcheck, `docker compose exec postgres psql`.
# Выйти на него можно только изнутри контейнера, то есть оператору с доступом к docker.
local   all   all                         trust

# Только TLS. Открытое соединение отвергается, а не «переходит» на пароль по сети.
hostnossl all all   all                   reject

# Сервисы в режиме cert (*_DB_AUTH=cert): клиентский сертификат должен быть выпущен нашим CA
# (ssl_ca_file) и иметь CN, равный имени роли. Пароля у таких ролей нет вовсе.
hostssl all   +pki_login   all            cert

# Сервисы, ещё не переведённые на сертификаты (*_DB_AUTH=password): пароль, но уже по TLS.
# Когда все сервисы переведены, эту строку нужно удалить.
hostssl all   +pw_login    all            scram-sha-256

# Всё остальное, в том числе суперпользователь по сети, отвергается.
hostssl all   all          all            reject
