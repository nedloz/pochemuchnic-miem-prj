# Маршруты llm-proxy. Подключаются в обычный HTTP-сервер (default.conf.template) и, с оверлеем
# mTLS, в сервер на 8443 (infra/mtls/llm-proxy.conf), поэтому поведение в обоих режимах одно.
#
# Открыт один вызов — POST /v1/chat/completions; остальное (модели, эмбеддинги, другие методы) — 403.

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# llm.route читает config.json, подменяет model в теле и переводит запрос во внутренний
# @router или @ollama. Сам ответ upstream передаёт proxy_pass — потоком, без буферизации.
location = /v1/chat/completions {
    if ($request_method != POST) {
        return 403;
    }
    js_content llm.route;
}

# Режим router: внешний OpenAI-совместимый роутер. Authorization клиента заменяется ключом
# из окружения; сертификат роутера проверяется по системным корневым сертификатам, чтобы ключ
# не ушёл подменённому серверу.
location @router {
    proxy_pass $llm_url;
    proxy_set_body $llm_body;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Authorization $llm_router_auth;

    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}

# Режим ollama: OpenAI-совместимый API Ollama (/v1/chat/completions). Ключа нет, Authorization
# клиента не пересылается. С оверлеем mTLS в /etc/nginx/llm-proxy-tls/ появляется клиентский
# сертификат прокси (ollama_client_tls.conf), без оверлея каталог пуст и ходим по обычному HTTP.
location @ollama {
    proxy_pass $llm_url;
    proxy_set_body $llm_body;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";

    include /etc/nginx/llm-proxy-tls/*.conf;
}

location / {
    return 403;
}
