# Основной конфиг llm-proxy (монтируется в /etc/nginx/nginx.conf). Здесь только то, что обязано
# стоять в main-контексте; сам прокси описан в default.conf.template и locations.conf, логика —
# в llm.js. Подробности: infra/llm-proxy/README.md.

# njs есть в образе nginx:1.27-alpine, но модуль нужно загрузить явно.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

# nginx очищает окружение рабочих процессов; без этой директивы njs не увидит ключ роутера
# (process.env.ROUTER_KEY). Ключ остаётся только в окружении: в файлы и логи он не попадает.
env ROUTER_KEY;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    keepalive_timeout 65;

    # default.conf (из default.conf.template) и, с оверлеем mTLS, mtls.conf (infra/mtls/llm-proxy.conf)
    include /etc/nginx/conf.d/*.conf;
}
