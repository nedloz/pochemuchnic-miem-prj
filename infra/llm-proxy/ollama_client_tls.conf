# Как llm-proxy ходит в Ollama в режиме mTLS. Подключается только оверлеем docker-compose.mtls.yml
# (монтируется в /etc/nginx/llm-proxy-tls/, его включает location @ollama), сертификат прокси
# выпускает `scripts/pki/enroll.sh llm-proxy`.
#
# Прокси предъявляет Ollama свой клиентский сертификат (CN llm-proxy; infra/mtls/ollama.conf
# пускает его только на /v1/chat/completions) и проверяет сертификат Ollama по корню нашего CA.
# В режим router эти настройки не попадают: там свой location и системные корневые сертификаты.

proxy_ssl_certificate         /pki-svc/tls.crt;
proxy_ssl_certificate_key     /pki-svc/tls.key;
proxy_ssl_trusted_certificate /pki-svc/root_ca.crt;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        2;
