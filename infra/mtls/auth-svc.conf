# Прокси перед auth-svc: взаимная TLS-аутентификация и политика «кто что может вызывать».
# Устроен так же, как graph-rag-svc.conf (см. комментарии там): приложение слушает только
# 127.0.0.1:8000, наружу смотрит этот прокси на 8443.
#
# К auth-svc ходят двое: шлюз (nginx) за тем, что обслуживается пользователям, и chat-svc за
# профилем пользователя. Эти наборы не пересекаются: шлюзу недоступны внутренние маршруты
# /internal/*, а chat-svc — публичные.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map "$caller:$uri" $allowed {
    default                                                              0;
    # nginx: вход/регистрация/обновление токена, проверка токена для auth_request, админ-сессия
    "~^nginx:/auth/"                                                     1;
    # nginx: профиль текущего пользователя
    "~^nginx:/users/me(/|$)"                                             1;
    # nginx: справочники факультетов и направлений для профиля
    "~^nginx:/core/(?:faculties|programs)$"                              1;
    # chat-svc: профиль пользователя для чата
    "~^chat-svc:/internal/users/[0-9a-fA-F-]+/profile$"                  1;
    # prometheus: только сбор метрик
    "~^prometheus:/metrics$"                                             1;
}

server {
    listen 8443 ssl;
    server_name auth-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Хост приложение видит прежний: Host шлюза нужен ему для ссылок в письмах и т. п.
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;
    }
}
