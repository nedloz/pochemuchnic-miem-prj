# Прокси перед chat-svc: взаимная TLS-аутентификация и политика «кто что может вызывать».
# Устроен так же, как graph-rag-svc.conf (см. комментарии там).
#
# К chat-svc ходят двое: шлюз (WebSocket чата пользователя) и graph-rag-svc (внутренний
# WebSocket, по которому в чат приходят события генерации). Оба соединения — WebSocket.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map "$caller:$uri" $allowed {
    default                                          0;
    "~^nginx:/ws/chat$"                              1;
    "~^graph-rag-svc:/ws/internal/llm$"              1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name chat-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
