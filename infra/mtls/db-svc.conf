# Прокси перед db-svc (админ-панель): взаимная TLS-аутентификация. Устроен так же, как
# graph-rag-svc.conf (см. комментарии там).
#
# К db-svc ходит только шлюз: админ-панель открывается через nginx после проверки админ-сессии.
# Что именно можно внутри панели, решает сам db-svc по подписанному контексту X-User-Context
# (аудитория db-svc, роль admin), поэтому пути здесь не ограничиваются.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map $caller $allowed {
    default                       0;
    nginx                         1;
}

server {
    listen 8443 ssl;
    server_name db-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    # Админка принимает zip-архивы с документами и выгрузки графа/чанков: такие же лимиты, как на шлюзе.
    client_max_body_size 512m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
