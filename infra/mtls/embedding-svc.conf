# Прокси перед embedding-svc: взаимная TLS-аутентификация и политика «кто что может вызывать».
# Устроен так же, как graph-rag-svc.conf (см. комментарии там): приложение слушает только
# 127.0.0.1:8000, наружу смотрит этот прокси на 8443.
#
# embedding-svc — единственный источник эмбеддингов и держит GPU, поэтому доступ к нему
# разрешён ровно тем, кто им пользуется: graph-rag-svc (поиск, построение графа) и ingest-worker
# (индексация документов).

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map "$caller:$uri" $allowed {
    default                                              0;
    "~^(graph-rag-svc|ingest-worker):/(embed|ping|health)$"  1;
    # prometheus: только сбор метрик
    "~^prometheus:/metrics$"                                 1;
}

server {
    listen 8443 ssl;
    server_name embedding-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    # Батчи текстов для /embed бывают большими (сотни чанков).
    client_max_body_size 50m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Caller-Identity $caller;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
