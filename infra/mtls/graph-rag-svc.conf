# Прокси перед graph-rag-svc: взаимная TLS-аутентификация и политика «кто что может вызывать».
# Работает в сетевом пространстве graph-rag-svc (docker-compose.mtls.yml): само приложение
# слушает только 127.0.0.1:8000 и снаружи недоступно, наружу смотрит этот прокси на 8443.
#
# Идентичность вызывающего — CN его сертификата, выпущенного внутренним CA (infra/pki). Сертификат
# без подписи нашего CA отвергается на рукопожатии. Политику читать так: «chat-svc может вызывать
# /generate и /cancel, db-svc — /internal/graph/..., остальным нельзя ничего, кроме проверки
# живости». Это те же вызовы, что есть сейчас; новый вызов нужно добавить сюда явно.

# CN клиентского сертификата. Формат $ssl_client_s_dn — RFC 2253: "CN=chat-svc".
map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

# $uri уже нормализован nginx (без ../ и //), поэтому обход через /generate/../internal/graph/
# не работает: правило применяется к итоговому пути.
map "$caller:$uri" $allowed {
    default                                        0;
    "~^chat-svc:/(generate|cancel)$"               1;
    "~^db-svc:/internal/graph(/|$)"                1;
    "~^(chat-svc|db-svc):/(healthz|ping)$"         1;
}

server {
    listen 8443 ssl;
    server_name graph-rag-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Проверенная идентичность для приложения. Присланное клиентом значение отбрасывается:
        # заголовок задаёт только этот прокси.
        proxy_set_header X-Caller-Identity $caller;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
