# Прокси перед library-svc: взаимная TLS-аутентификация и политика «кто что может вызывать».
# Устроен так же, как graph-rag-svc.conf (см. комментарии там).
#
# library-svc обслуживает только пользователей через шлюз, других вызывающих у него нет.
# Пользователя он определяет сам по подписанному контексту X-User-Context.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map "$caller:$uri" $allowed {
    default                                          0;
    "~^nginx:/library/"                              1;
    "~^nginx:/api/documents/"                        1;
    # prometheus: только сбор метрик
    "~^prometheus:/metrics$"                         1;
}

server {
    listen 8443 ssl;
    server_name library-svc;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;

        # Файлы документов отдаются потоком.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
