# llm-proxy за mTLS: взаимная TLS-аутентификация и политика по CN сертификата.
# В отличие от остальных файлов в этом каталоге, отдельного прокси-сайдкара здесь нет: llm-proxy сам
# nginx, поэтому этот сервер добавляется прямо в его конфигурацию (docker-compose.mtls.yml монтирует
# файл в /etc/nginx/conf.d/mtls.conf). Обычный HTTP-вход оверлей переводит на 127.0.0.1:8080, так что
# снаружи открыт только порт 8443 с проверкой сертификата.
#
# LLM вызывает только graph-rag-svc и только POST /v1/chat/completions. Маршруты те же, что без
# mTLS (infra/llm-proxy/locations.conf); куда уходит запрос, по-прежнему решает config.json.

map $ssl_client_s_dn $llm_proxy_caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

# $uri уже нормализован nginx, обход через /v1/chat/completions/../models не работает.
map "$llm_proxy_caller:$request_method:$uri" $llm_proxy_allowed {
    default                                            0;
    "graph-rag-svc:POST:/v1/chat/completions"          1;
}

server {
    listen 8443 ssl;
    server_name llm-proxy;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    if ($llm_proxy_allowed = 0) {
        return 403;
    }

    include /etc/nginx/llm-proxy/locations.conf;
}
