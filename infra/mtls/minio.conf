# Прокси перед MinIO: взаимная TLS-аутентификация и политика «кто что может» по CN сертификата.
# Устроен как library-svc.conf, но это шаблон (nginx подставляет ${MINIO_BUCKET} из окружения
# контейнера при старте, остальные $переменные остаются nginx'овыми).
#
# MinIO слушает только 127.0.0.1:9000 в том же сетевом пространстве; снаружи открыт порт 8443
# с проверкой клиентского сертификата. Ключи доступа S3 остаются (подпись запросов обязательна),
# но достучаться с ними можно только с сертификатом, а права определяет CN:
#
#   library-svc, ingest-worker  читают объекты бакета (GET, HEAD);
#   db-svc                      читает и пишет объекты бакета, видит список бакетов;
#   auth-svc                    читает, пишет и удаляет объекты бакета аватаров ${MINIO_AVATARS_BUCKET},
#                               в бакет документов не пускается;
#   prometheus                  читает только метрики (/minio/v2/metrics/cluster, /node).
#
# Остальным (в том числе graph-rag-svc и chat-svc) отказ 403. Путь нормализуется,
# обход через /documents/../ не работает. Консоль MinIO (порт 9001) снаружи недоступна.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

# путь запроса к S3 в path-style: /<бакет>/<ключ>, список бакетов — /
map "$caller:$request_method:$uri" $allowed {
    default                                                         0;
    "~^(?:library-svc|ingest-worker):(?:GET|HEAD):/${MINIO_BUCKET}(?:/.*)?$"   1;
    "~^db-svc:(?:GET|HEAD|PUT|POST|DELETE):/${MINIO_BUCKET}(?:/.*)?$"          1;
    "~^db-svc:GET:/$"                                               1;
    # auth-svc: только бакет аватаров; запись одним PUT (файл до 5 МБ), многочастной загрузки нет
    "~^auth-svc:(?:GET|HEAD|PUT|DELETE):/${MINIO_AVATARS_BUCKET}(?:/.*)?$"     1;
    # prometheus: только метрики кластера (MINIO_PROMETHEUS_AUTH_TYPE=public, ключи не нужны)
    "~^prometheus:GET:/minio/v2/metrics/(?:cluster|node)$"          1;
}

server {
    listen 8443 ssl;
    server_name minio;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    # размер загрузки ограничивает приложение, а не прокси
    client_max_body_size 0;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Подпись SigV4 покрывает Host: передаём его без изменений
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
