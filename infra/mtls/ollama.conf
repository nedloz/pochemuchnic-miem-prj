# Прокси перед Ollama: взаимная TLS-аутентификация и политика по CN сертификата.
# Устроен как library-svc.conf. У Ollama своей аутентификации нет, поэтому до него нельзя
# давать достучаться без прокси: он слушает только 127.0.0.1:11434 в том же сетевом пространстве.
#
# Генерацию вызывают graph-rag-svc (родной API чата) и llm-proxy в режиме ollama (только
# OpenAI-совместимый /v1/chat/completions, infra/llm-proxy). Управление моделями
# (/api/pull, /api/delete, /api/create, /api/push) никому снаружи не разрешено: модель
# загружает ollama-init изнутри сетевого пространства Ollama, минуя прокси.

map $ssl_client_s_dn $caller {
    default                       "";
    "~(?:^|,)CN=(?<cn>[^,]+)"     $cn;
}

map "$caller:$uri" $allowed {
    default                                          0;
    "~^graph-rag-svc:/api/(?:chat|generate|tags|version|show)$"   1;
    "~^llm-proxy:/v1/chat/completions$"                           1;
}

server {
    listen 8443 ssl;
    server_name ollama;

    ssl_certificate        /pki-svc/tls.crt;
    ssl_certificate_key    /pki-svc/tls.key;
    ssl_client_certificate /pki-svc/root_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        if ($allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Caller-Identity $caller;

        # ответ модели идёт потоком, долго
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
}
