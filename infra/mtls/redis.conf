# Прокси перед Redis: взаимная TLS-аутентификация для TCP (nginx stream), а не HTTP.
# Redis слушает только 127.0.0.1:6379 в том же сетевом пространстве; снаружи открыт порт 6380,
# на котором нужен клиентский сертификат нашего CA. Подключиться могут только auth-svc, chat-svc и redis-exporter (метрики):
# для остальных CN соединение уходит в закрытый порт и сбрасывается. Какие ключи видит сервис,
# решает его ACL-пользователь (scripts/gen_redis_acl.py).
#
# Это весь nginx.conf, а не фрагмент conf.d: stream не живёт внутри http.

worker_processes 1;
events { worker_connections 1024; }

stream {
    map $ssl_client_s_dn $redis_upstream {
        default                                         127.0.0.1:1;
        "~(?:^|,)CN=(?:auth-svc|chat-svc|redis-exporter)(?:,|$)"       127.0.0.1:6379;
    }

    server {
        listen 6380 ssl;

        ssl_certificate        /pki-svc/tls.crt;
        ssl_certificate_key    /pki-svc/tls.key;
        ssl_client_certificate /pki-svc/root_ca.crt;
        ssl_verify_client      on;
        ssl_verify_depth       2;
        ssl_protocols          TLSv1.2 TLSv1.3;

        proxy_pass $redis_upstream;
    }
}
