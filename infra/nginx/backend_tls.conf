# Как шлюз ходит в сервисы в режиме mTLS (docker-compose.mtls.yml монтирует этот файл в
# /etc/nginx/backend_tls/, а сертификат шлюза выпускает `scripts/pki/enroll.sh nginx`).
#
# Шлюз предъявляет сервисам свой клиентский сертификат (идентичность `nginx`) и проверяет их
# серверные сертификаты: цепочку до корня нашего CA и имя хоста. Что именно шлюзу можно
# вызывать, решают прокси перед сервисами (infra/mtls/*.conf): внутренние маршруты `/internal/*`
# ему недоступны, даже если шлюз окажется скомпрометирован.

proxy_ssl_certificate         /pki-svc/tls.crt;
proxy_ssl_certificate_key     /pki-svc/tls.key;
proxy_ssl_trusted_certificate /pki-svc/root_ca.crt;
proxy_ssl_verify              on;
proxy_ssl_verify_depth        2;
# SNI и проверка имени: по умолчанию имя берётся из хоста в proxy_pass (auth-svc, chat-svc, ...).
proxy_ssl_server_name         on;
proxy_ssl_protocols           TLSv1.2 TLSv1.3;
# Повторное использование TLS-сессий: каждый запрос пользователя порождает ещё и проверку токена
# в auth-svc, и полное рукопожатие на каждый из них было бы лишним.
proxy_ssl_session_reuse       on;
