worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # SPA-фолбэк. Раньше здесь был список вида `location = /login { try_files
        # /login.html; }` — конфиг достался от прежнего многостраничного прототипа. Vite
        # собирает единственный index.html плюс /assets/*, файлов login.html и profile.html
        # не существует, поэтому работал только `/`, а любой маршрут роутера и любая
        # перезагрузка страницы отдавали 404.
        #
        # Префиксная локация `/` имеет наименьший приоритет, поэтому /api/, /admin/ и
        # regex-локации ниже она не перехватывает.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Неизвестный путь под /api/ должен быть ошибкой, а не страницей приложения: без
        # этого он проваливался бы в SPA-фолбэк выше и клиент получал HTML с кодом 200
        # вместо 404. Конкретные /api/... локации длиннее и продолжают выигрывать.
        location /api/ {
            return 404;
        }


        location = /favicon.ico {
            try_files /favicon.ico =404;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            try_files /robots.txt =404;
            access_log off;
            log_not_found off;
        }

        # Открытие/закрытие админ-сессии. В отличие от публичных роутов auth-svc ниже,
        # здесь обязателен валидный access-токен: nginx проверяет его и передаёт X-User-Id,
        # по которому auth-svc определяет пользователя и его роль.
        # Regex-локации проверяются в порядке объявления, и эта идёт раньше публичного
        # блока auth-svc; впрочем, его перечисление роутов admin-session и не содержит.
        location ~ ^/api/auth/admin-session(/close)?$ {
            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/api(?<ap>/.*)$ $ap break;
            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_pass http://auth-svc:8000;
        }

        location ~ ^/api/auth/(login|register|logout|refresh|forgot-password|update-password|verify-email)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/api(?<p>/.*)$ $p break;
            proxy_pass http://auth-svc:8000;
        }

        # Проверка короткоживущей админ-куки перед входом в панель db-svc.
        # Отдельно от /auth/validate: там проверяется access-токен из заголовка, здесь —
        # кука, потому что переход в админку это обычная навигация браузера без Authorization.
        location = /auth/validate-admin {
            internal;
            proxy_pass http://auth-svc:8000/auth/validate-admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /auth/validate {
            internal;
            proxy_pass http://auth-svc:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /auth/validate_ws {
            internal;
            proxy_pass http://auth-svc:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $auth_header;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ~ ^/api/users/me(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://auth-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /api/chat/ {
            set $auth_header $http_authorization;
            if ($http_authorization = "") {
                set $auth_header "Bearer $arg_token";
            }

            auth_request /auth/validate_ws;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            rewrite ^/api/chat/?(.*)$ /$1 break;
            proxy_pass http://chat-svc:8000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/library/ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://library-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /api/documents/ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://library-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # Админ-панель (db-svc). Доступ решается ДО проксирования: при отсутствии
        # действующей админ-сессии nginx отвечает сам и к db-svc не обращается вовсе —
        # то есть HTML и JS панели не покидают контур. Это и есть требование
        # «не отдавать страницы админки не-админам»; скрытие адреса защитой не является.
        location /admin/ {
            auth_request /auth/validate-admin;
            auth_request_set $admin_user_id $upstream_http_x_user_id;
            auth_request_set $admin_user_role $upstream_http_x_user_role;

            # Не подтверждаем существование раздела тем, у кого нет прав. Не защита,
            # но и лишнего сигнала не даёт.
            error_page 401 403 = @admin_hidden;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # db-svc доверяет этим заголовкам от gateway — так же, как chat-svc доверяет
            # X-User-Id. Безопасно ровно потому, что его порт наружу не опубликован.
            proxy_set_header X-User-Id $admin_user_id;
            proxy_set_header X-User-Role $admin_user_role;

            # Собственный Bearer-токен db-svc в браузер не попадает: авторизацию
            # подтверждает gateway.
            proxy_set_header Authorization "";

            # Завершающий слэш срезает префикс /admin/ — db-svc отдаёт свои /static/ и /api/
            # по привычным путям, а браузер обращается к ним через <base href="/admin/">.
            proxy_pass http://db-svc:8000/;
        }

        location @admin_hidden {
            return 404;
        }

        location = /ping {
            add_header Content-Type text/plain;
            return 200 'pong';
        }

        location ~ /\. {
            deny all;
        }
    }
}
