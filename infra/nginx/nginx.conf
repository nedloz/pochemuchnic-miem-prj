worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location = / { try_files /index.html =404; }
        location = /login { try_files /login.html =404; }
        location = /library { try_files /library.html =404; }
        location = /file { try_files /file.html =404; }
        location = /register { try_files /register.html =404; }
        location = /confirm { try_files /confirm.html =404; }
        location = /forgot-password { try_files /forgot-password.html =404; }
        location = /reset-password { try_files /reset-password.html =404; }
        location = /profile { try_files /profile.html =404; }


        location = /favicon.ico {
            try_files /favicon.ico =404;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            try_files /robots.txt =404;
            access_log off;
            log_not_found off;
        }

        location ~ ^/api/auth/(login|register|logout|refresh|forgot-password|update-password|verify-email)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/api(?<p>/.*)$ $p break;
            proxy_pass http://auth-svc:8000;
        }

        location = /auth/validate {
            internal;
            proxy_pass http://auth-svc:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /auth/validate_ws {
            internal;
            proxy_pass http://auth-svc:8000/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $auth_header;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ~ ^/api/users/me(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://auth-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /api/chat/ {
            set $auth_header $http_authorization;
            if ($http_authorization = "") {
                set $auth_header "Bearer $arg_token";
            }

            auth_request /auth/validate_ws;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            rewrite ^/api/chat/?(.*)$ /$1 break;
            proxy_pass http://chat-svc:8000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/library/ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://library-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location /api/documents/ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://library-svc:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        location = /ping {
            add_header Content-Type text/plain;
            return 200 'pong';
        }

        location ~ /\. {
            deny all;
        }
    }
}
