worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # Как шлюз ходит в сервисы: схема и порт приходят из окружения (envsubst образа nginx):
    #   обычный режим  UPSTREAM_SCHEME=http   UPSTREAM_PORT=8000
    #   режим mTLS     UPSTREAM_SCHEME=https  UPSTREAM_PORT=8443  (docker-compose.mtls.yml)
    # В режиме mTLS шлюз предъявляет свой сертификат (идентичность nginx) и проверяет сервер:
    # настройки proxy_ssl_* лежат в infra/nginx/backend_tls.conf и подключаются здесь, а в обычном
    # режиме каталог пуст. Так один конфиг обслуживает оба режима.
    include /etc/nginx/backend_tls/*.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Статистика nginx для nginx-prometheus-exporter (docker-compose.observability.yml). Порт 8081
    # compose наружу не публикует: достижим только из app-network. Отдаёт лишь счётчики соединений.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # SPA-фолбэк. Раньше здесь был список вида `location = /login { try_files
        # /login.html; }` — конфиг достался от прежнего многостраничного прототипа. Vite
        # собирает единственный index.html плюс /assets/*, файлов login.html и profile.html
        # не существует, поэтому работал только `/`, а любой маршрут роутера и любая
        # перезагрузка страницы отдавали 404.
        #
        # Префиксная локация `/` имеет наименьший приоритет, поэтому /api/, /admin/ и
        # regex-локации ниже она не перехватывает.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Неизвестный путь под /api/ должен быть ошибкой, а не страницей приложения: без
        # этого он проваливался бы в SPA-фолбэк выше и клиент получал HTML с кодом 200
        # вместо 404. Конкретные /api/... локации длиннее и продолжают выигрывать.
        location /api/ {
            return 404;
        }


        location = /favicon.ico {
            try_files /favicon.ico =404;
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            try_files /robots.txt =404;
            access_log off;
            log_not_found off;
        }

        # Открытие/закрытие админ-сессии. В отличие от публичных роутов auth-svc ниже,
        # здесь обязателен валидный access-токен: nginx проверяет его и передаёт подписанный
        # контекст пользователя X-User-Context, по которому auth-svc определяет пользователя
        # и его роль.
        # Regex-локации проверяются в порядке объявления, и эта идёт раньше публичного
        # блока auth-svc; впрочем, его перечисление роутов admin-session и не содержит.
        location ~ ^/api/auth/admin-session(/close)?$ {
            auth_request /auth/validate/auth-svc;
            auth_request_set $user_ctx $upstream_http_x_user_context;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            rewrite ^/api(?<ap>/.*)$ $ap break;
            proxy_set_header Authorization "";
            proxy_set_header X-User-Context $user_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT};
        }

        location ~ ^/api/auth/(login|register|logout|refresh|forgot-password|update-password|verify-email)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Эти маршруты открыты без токена; контекст пользователя им не нужен, и присланный
            # клиентом заголовок до auth-svc не доходит.
            proxy_set_header X-User-Context "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";

            rewrite ^/api(?<p>/.*)$ $p break;
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT};
        }

        # Проверка короткоживущей админ-куки перед входом в панель db-svc.
        # Отдельно от /auth/validate: там проверяется access-токен из заголовка, здесь —
        # кука, потому что переход в админку это обычная навигация браузера без Authorization.
        location = /auth/validate-admin {
            internal;
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT}/auth/validate-admin?aud=db-svc;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Проверка токена клиента перед проксированием. auth-svc отвечает подписанным контекстом
        # пользователя X-User-Context (services/auth-svc/app/user_context.py), адресованным
        # конкретному сервису. Аудитория задаётся здесь, в внутренней локации: клиент подставить её
        # не может. Сервис проверяет подпись и аудиторию, поэтому подделать «я пользователь X» из
        # соседнего контейнера нельзя, а токен, выданный для одного сервиса, другому не подходит.
        location = /auth/validate/auth-svc {
            internal;
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT}/auth/validate?aud=auth-svc;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /auth/validate/library-svc {
            internal;
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT}/auth/validate?aud=library-svc;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        # WebSocket: токен приходит параметром ?token=..., а не заголовком (браузер не умеет
        # задавать заголовки при рукопожатии), поэтому Authorization собирается в $auth_header.
        location = /auth/validate_ws/chat-svc {
            internal;
            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT}/auth/validate?aud=chat-svc;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $auth_header;
            proxy_set_header Host auth-svc;
            proxy_set_header X-Original-URI $request_uri;
        }

        location ~ ^/api/users/me(/.*)?$ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate/auth-svc;
            auth_request_set $user_ctx $upstream_http_x_user_context;

            proxy_pass ${UPSTREAM_SCHEME}://auth-svc:${UPSTREAM_PORT};
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Context $user_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        location /api/chat/ {
            set $auth_header $http_authorization;
            if ($http_authorization = "") {
                set $auth_header "Bearer $arg_token";
            }

            auth_request /auth/validate_ws/chat-svc;
            auth_request_set $user_ctx $upstream_http_x_user_context;

            rewrite ^/api/chat/?(.*)$ /$1 break;
            proxy_pass ${UPSTREAM_SCHEME}://chat-svc:${UPSTREAM_PORT};

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Context $user_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/library/ {
            rewrite ^/api(/.*)$ $1 break;

            auth_request /auth/validate/library-svc;
            auth_request_set $user_ctx $upstream_http_x_user_context;

            proxy_pass ${UPSTREAM_SCHEME}://library-svc:${UPSTREAM_PORT};
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Context $user_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        location /api/documents/ {
            # Путь уходит в library-svc как есть: после IVHR-24 у сервиса остались только
            # маршруты /api/documents/..., и прежний rewrite со срезанным /api давал 404.

            auth_request /auth/validate/library-svc;
            auth_request_set $user_ctx $upstream_http_x_user_context;

            proxy_pass ${UPSTREAM_SCHEME}://library-svc:${UPSTREAM_PORT};
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
            proxy_set_header X-User-Context $user_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        # Админ-панель (db-svc). Доступ решается ДО проксирования: при отсутствии
        # действующей админ-сессии nginx отвечает сам и к db-svc не обращается вовсе —
        # то есть HTML и JS панели не покидают контур. Это и есть требование
        # «не отдавать страницы админки не-админам»; скрытие адреса защитой не является.
        location /admin/ {
            # Админка принимает zip-архивы с документами (импорт файлов в MinIO), а глобальных
            # 10 МБ хватает на пару файлов. Лимит ограничен областью /admin/, доступной только
            # администратору.
            client_max_body_size 512m;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            auth_request /auth/validate-admin;
            auth_request_set $admin_ctx $upstream_http_x_user_context;

            # Не подтверждаем существование раздела тем, у кого нет прав. Не защита,
            # но и лишнего сигнала не даёт.
            error_page 401 403 = @admin_hidden;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # db-svc принимает администратора только по подписанному контексту auth-svc
            # (аудитория db-svc), а не по заголовкам, которые мог бы выставить кто угодно.
            proxy_set_header X-User-Context $admin_ctx;
            # Голые заголовки больше не передаются, а присланные клиентом отбрасываются.
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";

            # Собственный Bearer-токен db-svc в браузер не попадает: авторизацию
            # подтверждает gateway.
            proxy_set_header Authorization "";

            # Завершающий слэш срезает префикс /admin/ — db-svc отдаёт свои /static/ и /api/
            # по привычным путям, а браузер обращается к ним через <base href="/admin/">.
            proxy_pass ${UPSTREAM_SCHEME}://db-svc:${UPSTREAM_PORT}/;
        }

        location @admin_hidden {
            return 404;
        }

        location = /ping {
            add_header Content-Type text/plain;
            return 200 'pong';
        }

        location ~ /\. {
            deny all;
        }
    }
}
