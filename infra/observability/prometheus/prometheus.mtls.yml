# За mTLS (docker-compose.mtls.yml): приложения слушают только localhost, снаружи — прокси на :8443,
# пускающий prometheus лишь на GET /metrics (infra/mtls/*.conf). Prometheus предъявляет сертификат
# с CN=prometheus из /pki-svc (docker-compose.observability.mtls.yml) и сам перечитывает его при
# обновлении. Имя в цели совпадает с SAN сертификата сервиса, поэтому server_name не нужен.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Экспортёры в app-network, до них доходит только Prometheus; они сами ходят в хранилища
  # со своими учётными данными и сертификатами (docker-compose.observability.mtls.yml).
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # MinIO за прокси на :8443; политика пускает prometheus только на /minio/v2/metrics/cluster.
  - job_name: minio
    scheme: https
    metrics_path: /minio/v2/metrics/cluster
    tls_config:
      ca_file: /pki-svc/root_ca.crt
      cert_file: /pki-svc/tls.crt
      key_file: /pki-svc/tls.key
    static_configs:
      - targets: ["minio:8443"]

  - job_name: services
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /pki-svc/root_ca.crt
      cert_file: /pki-svc/tls.crt
      key_file: /pki-svc/tls.key
    static_configs:
      - targets: ["auth-svc:8443"]
        labels: { service: auth-svc }
      - targets: ["chat-svc:8443"]
        labels: { service: chat-svc }
      - targets: ["library-svc:8443"]
        labels: { service: library-svc }
      - targets: ["db-svc:8443"]
        labels: { service: db-svc }
      - targets: ["graph-rag-svc:8443"]
        labels: { service: graph-rag-svc }
      - targets: ["embedding-svc:8443"]
        labels: { service: embedding-svc }

  # У ingest-worker нет входящего прокси (он только вызывает другие сервисы), поэтому его
  # порт метрик (METRICS_PORT) открыт по http внутри app-network. Отдаёт только метрики.
  - job_name: ingest-worker
    static_configs:
      - targets: ["ingest-worker:9464"]
        labels: { service: ingest-worker }
