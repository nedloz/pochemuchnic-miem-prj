# Простой режим (без docker-compose.mtls.yml): сервисы слушают :8000 и отдают /metrics открыто.
# За mTLS используется prometheus.mtls.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-svc:8000"]
        labels: { service: auth-svc }
      - targets: ["chat-svc:8000"]
        labels: { service: chat-svc }
      - targets: ["library-svc:8000"]
        labels: { service: library-svc }
      - targets: ["db-svc:8000"]
        labels: { service: db-svc }
      - targets: ["graph-rag-svc:8000"]
        labels: { service: graph-rag-svc }
      - targets: ["embedding-svc:8000"]
        labels: { service: embedding-svc }
      # У ingest-worker нет HTTP-сервера приложения: метрики на отдельном порту (METRICS_PORT).
      - targets: ["ingest-worker:9464"]
        labels: { service: ingest-worker }
